name: Actualizar SofaScore y Supabase

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 Argentina
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: self-hosted

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar datos de SofaScore
        run: python sofascore_descarga_completa.py

      - name: Actualizar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sofascore_to_supabase.py
